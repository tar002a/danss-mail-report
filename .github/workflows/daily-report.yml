name: Daily mail-flow report

on:
  schedule:
    - cron: "0 17 * * *"  # 20:00 Baghdad (UTC+3, no DST)
  workflow_dispatch:
    inputs:
      window_end:
        description: 'End of the 24-hour window: "now", an ISO time, or blank for the last 20:00'
        required: false
        default: ""

permissions:
  id-token: write  # OIDC sign-in to Microsoft Entra, no stored secret
  contents: read
  actions: write   # keep-alive below

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs and packages to hashes, so a compromised
      # upstream release can't run code in a job that holds the Entra token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet --require-hashes --no-deps -r requirements.txt
      - run: python report.py
        env:
          TENANT_ID: ${{ vars.TENANT_ID }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          REPORT_SENDER: ${{ vars.REPORT_SENDER }}
          REPORT_TO: ${{ vars.REPORT_TO }}
          INTERNAL_DOMAINS: ${{ vars.INTERNAL_DOMAINS }}
          WINDOW_END: ${{ inputs.window_end }}
      # GitHub disables schedules in public repos after 60 days without activity;
      # re-enabling the workflow resets that timer.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-report.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
